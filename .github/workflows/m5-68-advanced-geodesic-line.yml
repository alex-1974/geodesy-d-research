name: M5 advanced geodesic line research

on:
  pull_request:
    paths:
      - "research/m5-68-advanced-geodesic-line/**"
      - ".github/workflows/m5-68-advanced-geodesic-line.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout-probe:
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - ldc-1.41.0

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout research
        uses: actions/checkout@v6

      - name: Checkout geodesy-d develop
        uses: actions/checkout@v6
        with:
          repository: alex-1974/geodesy-d
          ref: develop
          path: geodesy-d
          persist-credentials: false

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Run M5 #68 layout probe
        shell: bash
        env:
          GEODESY_D_REPO: ${{ github.workspace }}/geodesy-d
          DC: ${{ startsWith(matrix.compiler, 'dmd') && 'dmd' || 'ldc2' }}
        run: |
          bash research/m5-68-advanced-geodesic-line/run.sh \
            | tee m5-68-layout.txt

      - name: Upload layout evidence
        uses: actions/upload-artifact@v5
        with:
          name: m5-68-layout-${{ matrix.compiler }}
          path: m5-68-layout.txt
