name: M2 geodesic quantities API

on:
  pull_request:
    paths:
      - "research/m2-geodesic-quantities-api/**"
      - ".github/workflows/m2-geodesic-quantities-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout research
        uses: actions/checkout@v6

      - name: Checkout geodesy-d quantities branch
        uses: actions/checkout@v6
        with:
          repository: alex-1974/geodesy-d
          ref: feature/m2-geodesic-quantities-api
          path: geodesy-d
          persist-credentials: false

      - name: Checkout GeographicLib 2.7
        uses: actions/checkout@v6
        with:
          repository: geographiclib/geographiclib
          ref: v2.7
          path: geographiclib
          persist-credentials: false

      - name: Install LDC baseline
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.41.0

      - name: Build GeographicLib 2.7
        shell: bash
        run: |
          set -euxo pipefail
          cmake \
            -S geographiclib \
            -B geographiclib-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/geographiclib-2.7" \
            -DBUILD_SHARED_LIBS=ON
          cmake --build geographiclib-build --parallel 2
          cmake --install geographiclib-build

      - name: Validate public quantities API
        shell: bash
        env:
          GEODESY_D_REPO: ${{ github.workspace }}/geodesy-d
          GEOGRAPHICLIB_ROOT: ${{ runner.temp }}/geographiclib-2.7
          DC: ldc2
          CXX: g++
        run: |
          bash research/m2-geodesic-quantities-api/run.sh \
            | tee geodesic-quantities-validation.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v5
        with:
          name: geodesic-quantities-validation
          path: geodesic-quantities-validation.txt
