name: M5 #106 all-intersection performance build

on:
  pull_request:
    paths:
      - "benchmarks/m5-106-all/**"
      - ".github/workflows/m5-106-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: alex-1974/geodesy-d
          ref: 7f31cc90cd8ab7ba673d16aa2219ef4c7b540a96
          path: geodesy-d
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: geographiclib/geographiclib
          ref: v2.7
          path: geographiclib
          persist-credentials: false
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.41.0
      - name: Build GeographicLib
        run: |
          cmake -S geographiclib -B geographiclib-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/geographiclib-2.7" \
            -DBUILD_SHARED_LIBS=ON
          cmake --build geographiclib-build --parallel 2
          cmake --install geographiclib-build
      - name: Build and smoke benchmark
        env:
          GEODESY_D_REPO: \${{ github.workspace }}/geodesy-d
          GEOGRAPHICLIB_ROOT: \${{ runner.temp }}/geographiclib-2.7
          DC: ldc2
          CXX: g++
          M5_106_CPU: 0
          M5_106_RUNS: 1
          M5_106_ROUNDS: 1
        run: bash benchmarks/m5-106-all/run.sh
