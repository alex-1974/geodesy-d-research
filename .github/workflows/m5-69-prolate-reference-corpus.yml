name: M5 #69 prolate reference corpus

on:
  pull_request:
    paths:
      - "research/m5-69-prolate-reference-corpus/**"
      - ".github/workflows/m5-69-prolate-reference-corpus.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-corpus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: geographiclib/geographiclib
          ref: v2.7
          path: geographiclib
          persist-credentials: false
      - name: Build GeographicLib 2.7
        run: |
          cmake -S geographiclib -B geographiclib-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/geographiclib-2.7" \
            -DBUILD_SHARED_LIBS=ON
          cmake --build geographiclib-build --parallel 2
          cmake --install geographiclib-build
      - name: Generate and verify R69.2 corpus
        env:
          GEOGRAPHICLIB_ROOT: ${{ runner.temp }}/geographiclib-2.7
          CXX: g++
        run: bash research/m5-69-prolate-reference-corpus/run.sh
