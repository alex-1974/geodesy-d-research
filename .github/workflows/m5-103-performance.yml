name: M5 #103 intersection performance build
on:
  pull_request:
    paths:
      - "benchmarks/m5-103-intersection/**"
      - ".github/workflows/m5-103-performance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: alex-1974/geodesy-d
          ref: b3905e4cbe39c9f7359dfd79553566acb4d454fa
          path: geodesy-d
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: geographiclib/geographiclib
          ref: v2.7
          path: geographiclib
          persist-credentials: false
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.41.0
      - name: Build GeographicLib
        run: |
          cmake -S geographiclib -B geographiclib-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/geographiclib-2.7" -DBUILD_SHARED_LIBS=ON
          cmake --build geographiclib-build --parallel 2
          cmake --install geographiclib-build
      - name: Build and smoke benchmark
        env:
          GEODESY_D_REPO: ${{ github.workspace }}/geodesy-d
          GEOGRAPHICLIB_ROOT: ${{ runner.temp }}/geographiclib-2.7
          DC: ldc2
          CXX: g++
          M5_103_CPU: 0
          M5_103_RUNS: 1
        run: bash benchmarks/m5-103-intersection/run.sh
