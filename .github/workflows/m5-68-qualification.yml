name: M5 advanced GeodesicLine qualification

on:
  pull_request:
    paths:
      - "research/m5-68-qualification/**"
      - "benchmarks/m5-68-geodesic-line-regression/**"
      - ".github/workflows/m5-68-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - ldc-1.41.0

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout research
        uses: actions/checkout@v6

      - name: Checkout geodesy-d candidate
        uses: actions/checkout@v6
        with:
          repository: alex-1974/geodesy-d
          ref: feature/m5-advanced-geodesic-line
          path: geodesy-d
          persist-credentials: false

      - name: Checkout GeographicLib 2.7
        uses: actions/checkout@v6
        with:
          repository: geographiclib/geographiclib
          ref: v2.7
          path: geographiclib
          persist-credentials: false

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Build GeographicLib 2.7
        shell: bash
        run: |
          set -euxo pipefail
          cmake \
            -S geographiclib \
            -B geographiclib-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/geographiclib-2.7" \
            -DBUILD_SHARED_LIBS=ON
          cmake --build geographiclib-build --parallel 2
          cmake --install geographiclib-build

      - name: Run advanced line differential validation
        shell: bash
        env:
          GEODESY_D_REPO: ${{ github.workspace }}/geodesy-d
          GEOGRAPHICLIB_ROOT: ${{ runner.temp }}/geographiclib-2.7
          DC: ${{ startsWith(matrix.compiler, 'dmd') && 'dmd' || 'ldc2' }}
          CXX: g++
        run: |
          bash research/m5-68-qualification/run.sh \
            | tee "m5-68-${{ matrix.compiler }}.txt"

      - name: Upload evidence
        uses: actions/upload-artifact@v5
        with:
          name: m5-68-${{ matrix.compiler }}
          path: m5-68-${{ matrix.compiler }}.txt

  benchmark-build-smoke:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout research
        uses: actions/checkout@v6

      - name: Checkout baseline
        uses: actions/checkout@v6
        with:
          repository: alex-1974/geodesy-d
          ref: 0d4da128bae12220cf6ea27391fadb3305a532bb
          path: baseline
          persist-credentials: false

      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          repository: alex-1974/geodesy-d
          ref: feature/m5-advanced-geodesic-line
          path: candidate
          persist-credentials: false

      - name: Install LDC baseline
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.41.0

      - name: Build identical baseline/candidate benchmark drivers
        shell: bash
        env:
          GEODESY_D_BASELINE_REPO: ${{ github.workspace }}/baseline
          GEODESY_D_CANDIDATE_REPO: ${{ github.workspace }}/candidate
          M5_68_BUILD_ONLY: 1
          DC: ldc2
        run: |
          bash benchmarks/m5-68-geodesic-line-regression/run.sh
