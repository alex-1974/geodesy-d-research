name: Verify initial snapshot

on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify pinned research snapshot
        shell: bash
        run: bash tools/verify-snapshot.sh
