name: M5 arc and unroll validation

on:
  pull_request:
    paths:
      - "research/m5-68-arc-unroll-validation/**"
      - ".github/workflows/m5-68-arc-unroll-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - ldc-1.41.0

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout research
        uses: actions/checkout@v6

      - name: Checkout geodesy-d feature branch
        uses: actions/checkout@v6
        with:
          repository: alex-1974/geodesy-d
          ref: feature/m5-advanced-geodesic-line
          path: geodesy-d
          persist-credentials: false

      - name: Checkout GeographicLib 2.7
        uses: actions/checkout@v6
        with:
          repository: geographiclib/geographiclib
          ref: v2.7
          path: geographiclib
          persist-credentials: false

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Build GeographicLib 2.7
        shell: bash
        run: |
          set -euxo pipefail
          cmake \
            -S geographiclib \
            -B geographiclib-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/geographiclib-2.7" \
            -DBUILD_SHARED_LIBS=ON
          cmake --build geographiclib-build --parallel 2
          cmake --install geographiclib-build

      - name: Validate arc and longitude-unroll semantics
        shell: bash
        env:
          GEODESY_D_REPO: ${{ github.workspace }}/geodesy-d
          GEOGRAPHICLIB_ROOT: ${{ runner.temp }}/geographiclib-2.7
          DC: ${{ startsWith(matrix.compiler, 'dmd') && 'dmd' || 'ldc2' }}
          CXX: g++
        run: |
          bash research/m5-68-arc-unroll-validation/run.sh \
            | tee m5-68-arc-unroll-validation.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v5
        with:
          name: m5-68-arc-unroll-${{ matrix.compiler }}
          path: m5-68-arc-unroll-validation.txt
