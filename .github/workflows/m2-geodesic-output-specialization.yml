name: M2 geodesic output specialization

on:
  pull_request:
    paths:
      - "research/m2-geodesic-output-specialization/**"
      - ".github/workflows/m2-geodesic-output-specialization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codegen:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout research
        uses: actions/checkout@v6

      - name: Checkout geodesy-d feature branch
        uses: actions/checkout@v6
        with:
          repository: alex-1974/geodesy-d
          ref: feature/m2-geodesic-output-specialization
          path: geodesy-d
          persist-credentials: false

      - name: Install LDC baseline
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.41.0

      - name: Toolchain
        shell: bash
        run: |
          ldc2 --version
          objdump --version | sed -n '1p'
          nm --version | sed -n '1p'

      - name: Inspect specialized codegen
        shell: bash
        env:
          GEODESY_D_REPO: ${{ github.workspace }}/geodesy-d
          DC: ldc2
        run: |
          bash research/m2-geodesic-output-specialization/run-codegen.sh \
            | tee geodesic-output-specialization-codegen.txt

      - name: Runtime specialization smoke benchmark
        shell: bash
        env:
          GEODESY_D_REPO: ${{ github.workspace }}/geodesy-d
          DC: ldc2
        run: |
          bash research/m2-geodesic-output-specialization/run-runtime.sh \
            | tee geodesic-output-specialization-runtime.txt

      - name: Upload specialization evidence
        uses: actions/upload-artifact@v5
        with:
          name: geodesic-output-specialization
          path: |
            geodesic-output-specialization-codegen.txt
            geodesic-output-specialization-runtime.txt
