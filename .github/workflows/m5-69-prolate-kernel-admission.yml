name: M5 #69 prolate kernel admission

on:
  pull_request:
    paths:
      - "research/m5-69-prolate-kernel-admission/**"
      - ".github/workflows/m5-69-prolate-kernel-admission.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - ldc-1.41.0
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: alex-1974/geodesy-d
          ref: develop
          path: geodesy-d
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: geographiclib/geographiclib
          ref: v2.7
          path: geographiclib
          persist-credentials: false
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
      - name: Build GeographicLib 2.7
        run: |
          cmake -S geographiclib -B geographiclib-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/geographiclib-2.7" \
            -DBUILD_SHARED_LIBS=ON
          cmake --build geographiclib-build --parallel 2
          cmake --install geographiclib-build
      - name: Run R69.3 kernel differential
        env:
          GEODESY_D_REPO: ${{ github.workspace }}/geodesy-d
          GEOGRAPHICLIB_ROOT: ${{ runner.temp }}/geographiclib-2.7
          DC: ${{ startsWith(matrix.compiler, 'dmd') && 'dmd' || 'ldc2' }}
          CXX: g++
        run: bash research/m5-69-prolate-kernel-admission/run.sh
